openapi: 3.0.0
info:
  title: Inclusive Access Kit API
  description: Backend REST APIs for the ALX Accessible Onboarding Hackathon.
  version: 1.0.0
servers:
  - url: https://inclusive-onboarding-backend.onrender.com/api/v1
    description: Production Server (Render)
  - url: http://localhost:4000/api/v1
    description: Local Development Server

paths:
  /learners:
    post:
      summary: Create a new learner profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                contact:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [phone, email]
                    value:
                      type: string
                idRoute:
                  type: string
                  enum: [kebele, passport, refugee, other_document, referral]
                partnerRef:
                  type: string
                consentGiven:
                  type: boolean
      responses:
        '201':
          description: Learner created successfully
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    example: { "contact.value": "Your phone number looks short." }

  /learners/{id}:
    get:
      summary: Get a learner's profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Learner profile retrieved
        '404':
          description: Learner not found
    patch:
      summary: Update a learner's profile
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Learner updated successfully
    delete:
      summary: Delete a learner and all associated data
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Learner deleted successfully

  /learners/{id}/support:
    put:
      summary: Save private support needs
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: string
                    enum: [read_aloud, larger_text, voice_input, more_time, sign_language, other]
      responses:
        '200':
          description: Support needs saved successfully
    get:
      summary: Get private support needs
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Support needs retrieved successfully
        '404':
          description: Support record not found

  /learners/{id}/export:
    get:
      summary: Export all data for a learner
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Learner data exported successfully

  /referrals:
    post:
      summary: Create a partner referral
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                learnerId:
                  type: string
                partner:
                  type: string
                contactPreference:
                  type: string
                  enum: [phone, email]
      responses:
        '201':
          description: Referral created with pending status

  /progress:
    post:
      summary: Auto-save partial form data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                flow:
                  type: string
                  enum: [onboarding, profile_edit, job_apply, employer_form]
                stepIndex:
                  type: integer
                answers:
                  type: object
      responses:
        '201':
          description: Progress saved successfully

  /progress/{sessionId}:
    get:
      summary: Get form progress for resume
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Progress retrieved successfully
        '404':
          description: Progress not found

  /jobs:
    get:
      summary: Retrieve jobs, optionally filtered by accommodations
      parameters:
        - in: query
          name: support
          schema:
            type: string
          description: Comma-separated list of accommodations (e.g. read_aloud,flexible_hours)
        - in: query
          name: format
          schema:
            type: string
          description: Set to 'jsonld' for schema.org/JobPosting output
      responses:
        '200':
          description: A list of jobs
    post:
      summary: Employer creates a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                employer:
                  type: string
                description:
                  type: string
                accommodations:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Job created successfully

  /applications:
    post:
      summary: Learner applies for a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                learnerId:
                  type: string
                jobId:
                  type: string
                answers:
                  type: object
                supportRequested:
                  type: boolean
      responses:
        '201':
          description: Application submitted successfully