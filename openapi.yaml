openapi: 3.0.0
info:
  title: Inclusive Access Kit API
  description: Backend REST APIs for the ALX Accessible Onboarding Hackathon.
  version: 1.0.0
servers:
  - url: http://localhost:4000/api
    description: Local Development Server

paths:
  /learners:
    post:
      summary: Create a new learner profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                contact:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [phone, email]
                    value:
                      type: string
                idRoute:
                  type: string
                  enum: [kebele, passport, refugee, other_document, referral]
      responses:
        '201':
          description: Learner created successfully
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    example: { "contact.value": "Your phone number looks short." }

  /learners/{id}/support:
    post:
      summary: Save private support needs
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: string
                    enum: [read_aloud, larger_text, voice_input, more_time, sign_language, other]
      responses:
        '201':
          description: Support needs saved successfully

  /referrals:
    post:
      summary: Create a partner referral
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                learnerId:
                  type: string
                partner:
                  type: string
                contactPreference:
                  type: string
                  enum: [phone, email]
      responses:
        '201':
          description: Referral created with pending status

  /progress:
    post:
      summary: Auto-save partial form data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                flow:
                  type: string
                  enum: [onboarding, profile_edit, job_apply, employer_form]
                stepIndex:
                  type: integer
                answers:
                  type: object
      responses:
        '201':
          description: Progress saved successfully

  /jobs:
    get:
      summary: Retrieve jobs, optionally filtered by accommodations
      parameters:
        - in: query
          name: support
          schema:
            type: string
          description: Comma-separated list of accommodations (e.g. read_aloud,flexible_hours)
      responses:
        '200':
          description: A list of jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        employer:
                          type: string
                        accommodations:
                          type: array
                          items:
                            type: string